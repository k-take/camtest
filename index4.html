<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>カメラ＋お絵描き（ズーム対応）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

  <style>
    body {
      font-family: sans-serif;
      margin: 16px;
    }

    img, canvas {
      max-width: 100%;
      border: 1px solid #ccc;
    }

    #editor {
      display: none;
      touch-action: none;
      background: #000;
    }

    #finishBtn {
      display: none;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<h2>カメラ撮影＋お絵描き</h2>

<input type="file" accept="image/*" capture="environment" id="cameraInput">

<br><br>

<img id="preview" style="display:none;">
<canvas id="editor"></canvas>
<br>
<button id="finishBtn">決定</button>

<script>
  const input = document.getElementById('cameraInput');
  const preview = document.getElementById('preview');
  const canvas = document.getElementById('editor');
  const ctx = canvas.getContext('2d');
  const finishBtn = document.getElementById('finishBtn');

  let drawing = false;

  // ズーム・パン用
  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;
  let lastDist = null;

  /* ①② 撮影 */
  input.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      scale = 1;
      offsetX = offsetY = 0;
      redraw(img);
      preview.src = canvas.toDataURL();
      preview.style.display = 'block';
    };
    img.src = URL.createObjectURL(file);
  });

  /* ③ 編集画面へ */
  preview.onclick = () => {
    preview.style.display = 'none';
    canvas.style.display = 'block';
    finishBtn.style.display = 'inline';
  };

  function redraw(img = null) {
    ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);
    if (img) ctx.drawImage(img, 0, 0);
  }

  /* 座標変換（ズレ対策） */
  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    let cx, cy;

    if (e.touches) {
      cx = e.touches[0].clientX;
      cy = e.touches[0].clientY;
    } else {
      cx = e.clientX;
      cy = e.clientY;
    }

    return {
      x: (cx - rect.left - offsetX) / scale,
      y: (cy - rect.top - offsetY) / scale
    };
  }

  /* 描画開始 */
  function startDraw(e) {
    if (e.touches && e.touches.length === 2) return;
    e.preventDefault();
    drawing = true;
    const p = getCanvasPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }

  /* 描画 */
  function draw(e) {
    if (!drawing || (e.touches && e.touches.length === 2)) return;
    e.preventDefault();
    const p = getCanvasPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = 'red';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  function endDraw() {
    drawing = false;
  }

  /* ピンチズーム */
  canvas.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);

      if (lastDist) {
        const delta = dist / lastDist;
        scale *= delta;
        scale = Math.min(Math.max(scale, 0.5), 5);
        redraw();
      }
      lastDist = dist;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', () => lastDist = null);

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('touchstart', startDraw);
  canvas.addEventListener('touchmove', draw);
  canvas.addEventListener('touchend', endDraw);

  /* ⑤ JPEG化（短辺1200px・品質80） */
  finishBtn.onclick = () => {
    const srcImg = new Image();
    srcImg.onload = () => {
      const sw = srcImg.width;
      const sh = srcImg.height;
      const s = Math.min(sw, sh);
      const scaleFix = 1200 / s;

      const outCanvas = document.createElement('canvas');
      outCanvas.width = sw * scaleFix;
      outCanvas.height = sh * scaleFix;

      outCanvas.getContext('2d')
        .drawImage(srcImg, 0, 0, outCanvas.width, outCanvas.height);

      outCanvas.toBlob(blob => {
        preview.src = URL.createObjectURL(blob);
        preview.style.display = 'block';
        canvas.style.display = 'none';
        finishBtn.style.display = 'none';
      }, 'image/jpeg', 0.8);
    };
    srcImg.src = canvas.toDataURL();
  };
</script>

</body>
</html>
