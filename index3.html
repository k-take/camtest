<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>カメラ撮影＋お絵描き（JPEG 1200px）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: sans-serif;
      margin: 16px;
    }

    img, canvas {
      max-width: 100%;
      border: 1px solid #ccc;
    }

    #editor {
      display: none;
      touch-action: none; /* スマホスクロール防止 */
    }

    #finishBtn {
      display: none;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <h2>カメラ撮影＋お絵描き</h2>

  <!-- ① カメラ起動 -->
  <input
    type="file"
    accept="image/*"
    capture="environment"
    id="cameraInput"
  >

  <br><br>

  <!-- ② 確定画像表示 -->
  <img id="preview" style="display:none;">

  <!-- ③④ 編集用 -->
  <canvas id="editor"></canvas>
  <br>

  <!-- ⑤ 決定 -->
  <button id="finishBtn">決定</button>

  <script>
    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const canvas = document.getElementById('editor');
    const ctx = canvas.getContext('2d');
    const finishBtn = document.getElementById('finishBtn');

    let drawing = false;

    /* ①② 撮影 → Canvasへ描画 */
    cameraInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);

        preview.src = canvas.toDataURL();
        preview.style.display = 'block';
        canvas.style.display = 'none';
        finishBtn.style.display = 'none';
      };
      img.src = URL.createObjectURL(file);
    });

    /* ③ プレビュータップで編集 */
    preview.addEventListener('click', () => {
      preview.style.display = 'none';
      canvas.style.display = 'block';
      finishBtn.style.display = 'inline';
    });

    /* 座標取得（マウス・タッチ共通） */
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      if (e.touches) {
        return {
          x: e.touches[0].clientX - rect.left,
          y: e.touches[0].clientY - rect.top
        };
      }
      return {
        x: e.offsetX,
        y: e.offsetY
      };
    }

    /* ④ お絵描き処理 */
    function startDraw(e) {
      e.preventDefault();
      drawing = true;
      const p = getPos(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }

    function draw(e) {
      if (!drawing) return;
      e.preventDefault();
      const p = getPos(e);
      ctx.lineTo(p.x, p.y);
      ctx.strokeStyle = 'red';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    function endDraw() {
      drawing = false;
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseout', endDraw);

    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', endDraw);

    /* ⑤ JPEG化（短辺1200px／品質80）して差し替え */
    finishBtn.addEventListener('click', () => {
      const srcImg = new Image();
      srcImg.onload = () => {
        const srcW = srcImg.width;
        const srcH = srcImg.height;

        const scale = srcW < srcH
          ? 1200 / srcW
          : 1200 / srcH;

        const dstW = Math.round(srcW * scale);
        const dstH = Math.round(srcH * scale);

        const outCanvas = document.createElement('canvas');
        outCanvas.width = dstW;
        outCanvas.height = dstH;

        const outCtx = outCanvas.getContext('2d');
        outCtx.drawImage(srcImg, 0, 0, dstW, dstH);

        outCanvas.toBlob(blob => {
          const file = new File(
            [blob],
            'edited_photo.jpg',
            { type: 'image/jpeg' }
          );

          preview.src = URL.createObjectURL(file);
          preview.style.display = 'block';
          canvas.style.display = 'none';
          finishBtn.style.display = 'none';

          // 👉 file が最終成果物（アップロード・保存用）
        }, 'image/jpeg', 0.8);
      };

      srcImg.src = canvas.toDataURL();
    });
  </script>
</body>
</html>
